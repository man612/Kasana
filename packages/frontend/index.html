<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lajur." />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Primary Meta Tags -->
    <title>Lajur.</title>
    <meta name="title" content="Lajur." />
    <meta
      name="description"
      content="Lajur. membantu mencatat pengeluaran, memantau saldo, dan menyusun anggaran pribadi."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lajur." />
    <meta
      property="og:description"
      content="Lajur. membantu mencatat pengeluaran, memantau saldo, dan menyusun anggaran pribadi."
    />
    <meta property="og:site_name" content="Lajur." />
    <!-- Use the current Lajur. PWA artwork as a safe, branded preview. -->
    <meta property="og:image" content="/web-app-manifest-512x512.png" />
    <meta property="og:image:alt" content="Lajur. app icon" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="Lajur." />
    <meta property="twitter:image" content="/web-app-manifest-512x512.png" />
    <meta
      property="twitter:description"
      content="Lajur. membantu mencatat pengeluaran, memantau saldo, dan menyusun anggaran pribadi."
    />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#7355be" />
  </head>
  <body>
    <noscript>
      <strong> Lajur. memerlukan JavaScript agar dapat berjalan. Aktifkan JavaScript di browser. </strong>
    </noscript>
    <div id="app"></div>
    <!-- Runtime config shim. Served by the Docker entrypoint in production
         (window.__APP_CONFIG__); a public/ placeholder covers dev. Must load
         before the app module so config reads see it. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
