<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tidak ada koneksi internet · Lajur.</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #18181b;
      }
      main {
        box-sizing: border-box;
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid #d4d4d8;
        border-radius: 1rem;
      }
      h1 {
        margin: 0.5rem 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0.5rem 0 1rem;
        line-height: 1.5;
      }
      strong {
        color: #2563eb;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: white;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d0c0b;
          color: #f4f4f5;
        }
        main {
          background: #191817;
          border-color: #3f3f46;
        }
        strong {
          color: #93c5fd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Lajur.</strong>
      <h1>Tidak ada koneksi internet</h1>
      <p>
        Buka kembali Lajur. setelah tersambung untuk memperbarui atau menyimpan data. Periksa koneksi internet, lalu
        coba lagi.
      </p>
      <a href="">Coba lagi</a>
    </main>
  </body>
</html>
