# Required Kasana build overlay: compile both finance applications from source.
# Pair with the separate private overlay so the local historical image names and
# volume namespaces remain stable.
#
# Usage (from the self-hosting directory):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.private.yml up -d --build
#
# Runtime configuration is unchanged: the frontend is still configured via the
# `environment:` block in the base file, and the backend via `env_file:`. The
# build args below only feed build-time concerns (e.g. Sentry source-map upload)
# and are all optional. To upload Sentry source maps from an independent
# build, pass a BuildKit secret explicitly. Never use a token as a build arg.

services:
  backend:
    build:
      context: ..
      dockerfile: self-hosting/backend/Dockerfile
      args:
        SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}

  frontend:
    build:
      context: ..
      dockerfile: self-hosting/frontend/Dockerfile
      args:
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-6144}
