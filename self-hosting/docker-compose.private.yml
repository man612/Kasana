# Kasana source overlay; Docker identifiers below are historical and retained.
# Repository GitHub is PUBLIC. DO NOT rename Compose project/network/image names
# without verified DB backup and volume migration; old named volumes rely on them.
# Combine with the upstream base and build overlays:
# docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.private.yml up -d --build
#
# Never use the upstream Docker image tags or network for Kasana.
# 'moneymatter-private' here is a legacy Docker identifier, not the GitHub URL.
name: moneymatter-private

services:
  backend:
    image: moneymatter-private-backend:local
    # First-time database migrations may exceed the upstream 60-second startup window.
    # Healthchecks still turn healthy immediately when the HTTP server is ready.
    healthcheck:
      start_period: 300s

  frontend:
    image: moneymatter-private-frontend:local
    environment:
      # Frontend AI/MCP descriptor URLs must match this deployment, not upstream.
      # No MCP endpoint is advertised unless the operator explicitly sets it.
      # An auth origin alone is not proof that OAuth/MCP is configured.
      MCP_BASE_URL: ${MCP_BASE_URL:-}

networks:
  budget-tracker:
    name: moneymatter-private-net
