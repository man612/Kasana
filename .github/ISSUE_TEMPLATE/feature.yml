name: Feature request
description: Suggest a new Kasana feature or improve an existing workflow.
labels: ['enhancement']
body:
  - type: textarea
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current workflow and why it is difficult. Use examples without personal data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed approach
      description: Explain the desired behavior. Screenshots, wireframes, or comparisons are welcome.
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Include simpler solutions and any known trade-offs.
  - type: dropdown
    attributes:
      label: Would you be interested in contributing?
      options:
        - 'No'
        - Maybe, with guidance
        - 'Yes'
