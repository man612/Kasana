name: Bug report
description: Report a bug in Lajur., its interface, or its self-hosted setup.
labels: ['bug']
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing issues and removed all passwords, tokens, and personal financial information.
          required: true
  - type: dropdown
    attributes:
      label: Environment
      options:
        - Self-hosted Lajur. (Docker)
        - Local development (Windows / Linux / macOS)
        - Source code or build pipeline
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      description: Provide the version, branch, or commit SHA if known.
      placeholder: main at abc1234
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior using synthetic data where possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, session cookies, personal details, and real account or transaction data.
  - type: input
    attributes:
      label: Browser or device
      placeholder: Chrome on Android, Firefox on Windows, Safari on iOS, etc.
