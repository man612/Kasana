name: Laporan bug Kasana
description: Laporkan masalah Kasana pada UI, transaksi, Docker, atau pengembangan lokal.
labels: ['bug']
body:
  - type: checkboxes
    attributes:
      label: Sebelum melapor
      options:
        - label: Saya sudah mencari issue serupa dan tidak akan membagikan password, token, atau data keuangan asli.
          required: true
  - type: dropdown
    attributes:
      label: Lingkungan
      options:
        - Kasana self-hosted (Docker)
        - Pengembangan lokal (Windows / Linux)
        - Belum dijalankan / masalah kode
    validations:
      required: true
  - type: input
    attributes:
      label: Versi / commit
      description: Isi SHA commit, nama branch, atau versi. Jika belum tahu, kosongkan.
      placeholder: main (SHA singkat) atau feat/...
  - type: textarea
    attributes:
      label: Masalah
      description: Apa yang terjadi? Gunakan contoh dan tangkapan layar tanpa data pribadi.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Cara mereproduksi
      placeholder: |
        1. Buka ...
        2. Pilih ...
        3. Terjadi ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log / error (tanpa data sensitif)
      description: Hapus secret, cookies, email, token, data rekening, dan transaksi asli sebelum mengirim.
      render: shell
  - type: input
    attributes:
      label: Browser / perangkat
      placeholder: Chrome Android, Firefox Windows, Safari iOS, dll.
