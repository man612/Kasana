name: One-time audit after redirect transport patch

on:
  push:
    branches: ['security/lajur-advisory-patches-20261114']

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'man612/Kasana' && contains(github.event.head_commit.message, '[audit-after-follow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Audit patched lockfiles
        run: node scripts/security-audit-one-time.mjs
