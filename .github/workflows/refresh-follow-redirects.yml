name: One-time redirect dependency patch

on:
  push:
    branches: ['security/lajur-advisory-patches-20261114']

permissions:
  contents: write

jobs:
  refresh-follow-redirects:
    if: github.repository == 'man612/Kasana' && contains(github.event.head_commit.message, '[refresh-follow-redirects]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Update the Axios redirect transport within allowed semver range
        run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund follow-redirects
      - name: Enforce all patched minimums
        run: node scripts/security-lockfile-check.mjs
      - name: Ensure manifests were not modified
        run: git diff --exit-code -- package.json packages/backend/package.json packages/frontend/package.json packages/landing/package.json packages/shared/package.json
      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): patch follow-redirects in npm lockfile'
          git push origin HEAD:security/lajur-advisory-patches-20261114
