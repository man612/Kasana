name: Dependency Baseline Audit

on:
  pull_request:
    paths:
      - 'package-lock.json'
      - 'packages/docs/package-lock.json'
      - 'scripts/audit-dependencies.mjs'
      - '.github/workflows/dependency-baseline-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  baseline:
    name: Report npm advisory baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Report current advisories from both lockfiles
        run: node scripts/audit-dependencies.mjs
